services:
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: production
    container_name: time-reserve-backend
    restart: unless-stopped
    expose:
      - "9000"

  backend-queue:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: production
    container_name: time-reserve-queue
    restart: unless-stopped
    entrypoint: []
    command: php artisan queue:work --tries=3 --timeout=90

  backend-cron:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: production
    container_name: time-reserve-cron
    restart: unless-stopped
    entrypoint: []
    command: php artisan schedule:work

  backend-webserver:
    image: nginx:1.25-alpine
    container_name: time-reserve-nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./back-end:/var/www:ro
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
