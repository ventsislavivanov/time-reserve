x-no-watchtower: &no-watchtower
  labels:
    - "com.centurylinklabs.watchtower.enable=false"

x-backend-base: &backend-base
  <<: *no-watchtower
  build:
    context: ./back-end
    dockerfile: Dockerfile
    target: ${BACKEND_TARGET:-development}
  env_file:
    - ./back-end/.env
  depends_on:
    database:
      condition: service_healthy

services:
  # 0. Database
  database:
    image: postgres:17.6-alpine
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: time-reserve-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./appdata/postgres:/var/lib/postgresql/data

  # 1. Laravel - Main container
  backend:
    <<: *backend-base
    container_name: time-reserve-backend
    restart: unless-stopped

  # Queue Worker
  backend-queue:
    <<: *backend-base
    container_name: time-reserve-queue
    restart: unless-stopped
    entrypoint: []
    command: php artisan queue:work --tries=3

  # Cron Scheduler
  backend-cron:
    <<: *backend-base
    container_name: time-reserve-cron
    restart: unless-stopped
    entrypoint: []
    command: php artisan schedule:work

  # 2. React
  react-frontend:
    <<: *no-watchtower
    container_name: time-reserve-react
    build:
      context: ./front-end-react
      dockerfile: Dockerfile
      target: ${REACT_TARGET:-development}
    ports:
      - "5173:80"
    volumes:
      - ./front-end-react:/app
    restart: unless-stopped

  # 3. Angular
  angular-frontend:
    <<: *no-watchtower
    container_name: time-reserve-angular
    build:
      context: ./front-end-angular
      dockerfile: Dockerfile
      target: ${ANGULAR_TARGET:-development}
    ports:
      - "4200:80"
    volumes:
      - ./front-end-angular:/app
    restart: unless-stopped
