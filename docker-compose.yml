services:
  # 0. Database
  database:
    image: postgres:17.6-alpine
    container_name: time-reserve-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./appdata/postgres:/var/lib/postgresql/data

  # 1. Laravel - Main container (Works on both dev and prod)
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: ${BACKEND_TARGET:-development}
    container_name: time-reserve-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT_BINDING:-8081:8080}"
    volumes:
      - ./back-end:/var/www
      - /var/www/vendor
    env_file:
      - ./back-end/.env
    depends_on:
      - database

  # 1.1 Laravel Nginx (Runs ONLY on production)
  backend-webserver:
    image: nginx:1.25-alpine
    container_name: time-reserve-nginx
    restart: unless-stopped
    profiles:
      - ${BACKEND_PROD_PROFILE:-development-skip}
    ports:
      - "8081:80" # On production Cloudflare hit here
    volumes:
      - ./back-end:/var/www
      - ./nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # 1.2 Laravel - Queue Worker
  backend-queue:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: ${BACKEND_TARGET:-development}
    container_name: time-reserve-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - ./back-end:/var/www
      - /var/www/vendor
    env_file:
      - ./back-end/.env
    depends_on:
      - database

  # 1.3 Laravel - Cron Scheduler
  backend-cron:
    build:
      context: ./back-end
      dockerfile: Dockerfile
      target: ${BACKEND_TARGET:-development}
    container_name: time-reserve-cron
    restart: unless-stopped
    command: php artisan schedule:work
    stop_grace_period: 1s
    volumes:
      - ./back-end:/var/www
      - /var/www/vendor
    env_file:
      - ./back-end/.env
    depends_on:
      - database

  # 2. React
  react-frontend:
    container_name: time-reserve-react
    build:
      context: ./front-end-react
      dockerfile: Dockerfile
      target: ${REACT_TARGET:-development}
    ports:
      - "5173:80"
    volumes:
      - ./front-end-react:/app
      - /app/node_modules
    restart: unless-stopped

  # 3. Angular
  angular-frontend:
    container_name: time-reserve-angular
    build:
      context: ./front-end-angular
      dockerfile: Dockerfile
      target: ${ANGULAR_TARGET:-development}
    ports:
      - "4200:80"
    volumes:
      - ./front-end-angular:/app
      - /app/node_modules
    restart: unless-stopped
