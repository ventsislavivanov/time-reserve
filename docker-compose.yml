services:
  # 0. Database
  database:
    image: postgres:17.6-alpine
    container_name: time-reserve-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=${DB_DATABASE:-postgres}
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ./appdata/postgres:/var/lib/postgresql/data

  # 1. Laravel - Web Application
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: time-reserve-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./back-end:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - database

  # 1.2 Laravel - Queue Worker
  backend-queue:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: time-reserve-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3
    volumes:
      - ./back-end:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - database

  # 1.3 Laravel - Cron Scheduler
  backend-cron:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: time-reserve-cron
    restart: unless-stopped
    command: php artisan schedule:work
    stop_grace_period: 1s
    volumes:
      - ./back-end:/var/www
      - /var/www/vendor
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    depends_on:
      - database

  # 2. React
  react-frontend:
    container_name: time-reserve-react
    build:
      context: ./front-end-react
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped
    networks:
      - default

  # 3. Angular
  angular-frontend:
    container_name: time-reserve-angular
    build:
      context: ./front-end-angular
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    restart: unless-stopped
    networks:
      - default
